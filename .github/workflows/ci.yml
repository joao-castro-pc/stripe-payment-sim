name: CI

# Build and test on every push to main and on every pull request, so a change
# that breaks the backend tests or the frontend build is caught before merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Restores, builds and runs the test suite. No Stripe secrets needed: the
      # tests inject dummy keys (see TestAppFactory) and a fake payment gateway.
      - name: Test
        run: dotnet test tests/PaymentSim.Api.Tests --configuration Release

      # The backend regenerates frontend/openapi.json on build (the contract is the
      # single source of truth). If it differs from what's committed, someone changed
      # the API without regenerating the contract -> fail so the FE types can't drift.
      - name: Contract is up to date
        run: git diff --exit-code -- frontend/openapi.json

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --legacy-peer-deps: openapi-typescript peers on TS 5, we use TS 6 (see
      # package.json). The lockfile was created the same way.
      - name: Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # `build` runs prebuild -> gen:api (regenerates src/api-types.ts from the
      # committed openapi.json), then tsc -b (typecheck) and vite build.
      - name: Build
        working-directory: frontend
        run: npm run build

      # Component/interaction tests (Vitest + React Testing Library, jsdom).
      - name: Test
        working-directory: frontend
        run: npm run test

  # Continuous deployment: on a push to main, once BOTH jobs above pass, deploy
  # to Fly.io. Skipped on pull requests (only runs for push events to main).
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never run two production deploys at once; a newer one cancels a queued one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA (not @master) so a compromised/updated upstream
      # can't run arbitrary code with our FLY_API_TOKEN. Bump the SHA deliberately.
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f662f1986 # v1.5
      # Build happens on Fly's remote builder (no Docker on the runner). The
      # publishable key comes from a repo variable (it's public, baked into the
      # bundle); FLY_API_TOKEN is a repo secret. --build-arg overrides fly.toml.
      - name: Deploy
        run: flyctl deploy --remote-only --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
